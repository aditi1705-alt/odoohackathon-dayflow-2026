<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DayFlow - Attendance & Payroll</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>DayFlow</h1>
        <p>Attendance and Payroll Management System</p>
    </header>

    <main>

        <!-- ATTENDANCE SECTION -->
        <section class="card">

            <h2>Attendance Management</h2>

            <div class="form-group">
                <label for="attendanceEmployeeId">
                    Employee ID
                </label>

                <input
                    type="text"
                    id="attendanceEmployeeId"
                    placeholder="Enter Employee ID"
                >
            </div>

            <div class="button-group">
                <button onclick="checkIn()">
                    Check In
                </button>

                <button onclick="checkOut()">
                    Check Out
                </button>

                <button onclick="getAttendance()">
                    View Attendance
                </button>
            </div>

            <div id="attendanceResult" class="result"></div>

        </section>


        <!-- PAYROLL SECTION -->
        <section class="card">

            <h2>Payroll Management</h2>

            <div class="form-group">
                <label for="payrollEmployeeId">
                    Employee ID
                </label>

                <input
                    type="text"
                    id="payrollEmployeeId"
                    placeholder="Enter Employee ID"
                >
            </div>

            <div class="form-group">
                <label for="basicSalary">
                    Basic Salary
                </label>

                <input
                    type="number"
                    id="basicSalary"
                    placeholder="Enter Basic Salary"
                >
            </div>

            <div class="form-group">
                <label for="allowances">
                    Allowances
                </label>

                <input
                    type="number"
                    id="allowances"
                    value="0"
                >
            </div>

            <div class="form-group">
                <label for="deductions">
                    Deductions
                </label>

                <input
                    type="number"
                    id="deductions"
                    value="0"
                >
            </div>

            <div class="button-group">
                <button onclick="createPayroll()">
                    Generate Payroll
                </button>

                <button onclick="getPayroll()">
                    View Payroll
                </button>
            </div>

            <div id="payrollResult" class="result"></div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
